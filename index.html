<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Pink Firebase Gallery</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #ffd1dc, #ff80ab);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 380px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
  text-align: center;
}

h1 {
  color: #ff2e63;
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 12px;
  border: 1px solid #ffb6c1;
}

button {
  background: linear-gradient(135deg, #ff2e63, #ff6b9a);
  border: none;
  color: white;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 15px;
  max-height: 300px;
  overflow-y: auto;
}

img {
  width: 100%;
  border-radius: 12px;
  margin: 6px 0;
}
</style>
</head>

<body>

<div class="card">
  <h1>💖 Pink Gallery</h1>

  <!-- ссылка -->
  <input id="photoUrl" placeholder="Вставь ссылку и нажми Enter">

  <!-- скрытый input -->
  <input type="file" id="fileInput" accept="image/*" hidden>

  <!-- красивая кнопка -->
  <button onclick="document.getElementById('fileInput').click()">
    📁 Выбрать фото
  </button>

  <ul id="list"></ul>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
