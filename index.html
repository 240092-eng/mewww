<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Pink Firebase App</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #ffd1dc, #ff80ab);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 380px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
  text-align: center;
  animation: pop 0.4s ease;
}

@keyframes pop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

h1 {
  color: #ff2e63;
  margin-bottom: 15px;
}

input {
  width: 90%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 12px;
  border: 1px solid #ffb6c1;
  outline: none;
}

button {
  background: linear-gradient(135deg, #ff2e63, #ff6b9a);
  border: none;
  color: white;
  padding: 12px 18px;
  margin: 6px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 15px rgba(255, 46, 99, 0.4);
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 15px;
  max-height: 220px;
  overflow-y: auto;
}

li {
  margin: 6px 0;
}
</style>
</head>

<body>

<div class="card">
  <h1>💖 My Pink Firestore</h1>

  <input id="name" placeholder="Имя">
  <input id="photo" placeholder="Ссылка на фото">

  <button onclick="addUser()">Добавить</button>
  <button onclick="loadUsers()">Загрузить</button>

  <ul id="list"></ul>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
