<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Pink Gallery</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #ffd1dc, #ff80ab);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 380px;
  text-align: center;
}

h1 { color: #ff2e63; }

input {
  width: 90%;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #ffb6c1;
  margin: 10px 0;
}

img {
  width: 100%;
  border-radius: 12px;
  margin-top: 8px;
}

.post {
  margin-bottom: 20px;
  background: #ffe6ee;
  padding: 10px;
  border-radius: 12px;
}

.like-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

.count {
  margin-left: 8px;
  color: #ff2e63;
  font-weight: bold;
}

ul {
  list-style: none;
  padding: 0;
  max-height: 300px;
  overflow-y: auto;
}
  .like-btn:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="card">
  <h1>💖 Pink Gallery</h1>

  <input id="photoUrl" placeholder="Вставь ссылку и нажми Enter">

  <ul id="list"></ul>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
